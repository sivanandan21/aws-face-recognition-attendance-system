name: CI/CD Pipeline - Smart Attendance System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-edge-and-backend:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r edge-kiosk/requirements.txt
          pip install -r aws-backend/handlers/requirements.txt
          pip install pytest pytest-mock

      - name: Run Test Suite
        run: |
          pytest tests/ -v --tb=short

  build-frontend:
    name: Build React Admin Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies & Build
        run: |
          cd dashboard
          npm ci
          npm run build

  validate-sam:
    name: Validate AWS SAM Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM Template
        run: |
          sam validate -t aws-backend/template.yaml --lint
