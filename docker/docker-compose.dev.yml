# Local Development Stack for Windows / macOS
# Runs Dashboard & DynamoDB-Local in Docker; Edge Kiosk runs natively
# in host Python venv for direct USB Webcam & CUDA GPU access.

services:
  # ==========================================
  # Local DynamoDB (AWS Mocking)
  # ==========================================
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: smart-attendance-dynamodb-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  # ==========================================
  # Admin Dashboard (Hot Reload Dev Server)
  # ==========================================
  dashboard-dev:
    image: node:22-alpine
    container_name: smart-attendance-dashboard-dev
    working_dir: /app
    volumes:
      - ../dashboard:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_API_KEY=dev-kiosk-secret-key-change-in-prod
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
